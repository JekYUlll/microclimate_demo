<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微气候预测系统</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .station-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9fa;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .station-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .station-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .status-ready {
            background: #d4edda;
            color: #155724;
        }
        
        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }
        
        .forecast-data {
            margin-top: 15px;
        }
        
        .forecast-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .forecast-item:last-child {
            border-bottom: none;
        }
        
        .forecast-label {
            font-weight: 500;
            color: #555;
        }
        
        .forecast-value {
            color: #2c3e50;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: #2980b9;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        
        .connection-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .connection-status.connected {
            background-color: #d4edda;
            color: #155724;
        }
        
        .connection-status.connecting {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .connection-status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .last-update {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ 微气候预测系统</h1>
            <p>实时监控南极各站点气象数据并进行预测</p>
            <div class="status-bar">
                <div id="connection-status" class="connection-status">连接中...</div>
                <div id="last-update" class="last-update"></div>
            </div>
        </div>
        
        <div class="content">
            <button class="refresh-btn" onclick="loadData()">🔄 刷新数据</button>
            
            <div id="loading" class="loading">
                <p>正在加载数据...</p>
            </div>
            
            <div id="stations-container" class="stations-grid" style="display: none;">
                <!-- 站点数据将在这里动态加载 -->
            </div>
            
            <div id="last-update" class="last-update"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const WS_URL = 'ws://localhost:8000/ws';
        let websocket = null;
        
        // WebSocket连接管理
        function connectWebSocket() {
            try {
                websocket = new WebSocket(WS_URL);
                
                websocket.onopen = function(event) {
                    console.log('WebSocket连接已建立');
                    updateConnectionStatus('connected');
                };
                
                websocket.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };
                
                websocket.onclose = function(event) {
                    console.log('WebSocket连接已断开，尝试重连...');
                    updateConnectionStatus('disconnected');
                    // 3秒后重连
                    setTimeout(connectWebSocket, 3000);
                };
                
                websocket.onerror = function(error) {
                    console.error('WebSocket错误:', error);
                    updateConnectionStatus('disconnected');
                };
            } catch (error) {
                console.error('WebSocket连接失败:', error);
                // 5秒后重试
                setTimeout(connectWebSocket, 5000);
            }
        }
        
        // 更新连接状态显示
        function updateConnectionStatus(status) {
            const statusElement = document.getElementById('connection-status');
            if (statusElement) {
                statusElement.className = `connection-status ${status}`;
                switch(status) {
                    case 'connected':
                        statusElement.textContent = '🟢 已连接';
                        break;
                    case 'connecting':
                        statusElement.textContent = '🟡 连接中...';
                        break;
                    case 'disconnected':
                        statusElement.textContent = '🔴 已断开';
                        break;
                }
            }
        }
        
        // 处理WebSocket消息
        function handleWebSocketMessage(data) {
            if (data.type === 'prediction_update') {
                updateStationPrediction(data.station, data.forecast);
            }
        }
        
        // 更新站点预测数据
        function updateStationPrediction(stationName, forecast) {
            const forecastElement = document.getElementById(`forecast-${stationName}`);
            if (forecastElement) {
                const forecastHtml = generateForecastHtml(forecast);
                forecastElement.innerHTML = forecastHtml;
                
                // 更新最后更新时间
                document.getElementById('last-update').textContent = 
                    `最后更新: ${new Date().toLocaleString('zh-CN')}`;
            }
        }
        
        async function loadData() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('stations-container');
            const lastUpdate = document.getElementById('last-update');
            
            loading.style.display = 'block';
            container.style.display = 'none';
            
            try {
                // 获取所有站点信息
                const stationsResponse = await fetch(`${API_BASE}/stations`);
                const stations = await stationsResponse.json();
                
                // 清空容器
                container.innerHTML = '';
                
                // 为每个站点加载预测数据
                for (const [stationName, stationInfo] of Object.entries(stations)) {
                    const stationCard = await createStationCard(stationName, stationInfo);
                    container.appendChild(stationCard);
                }
                
                loading.style.display = 'none';
                container.style.display = 'grid';
                lastUpdate.textContent = `最后更新: ${new Date().toLocaleString('zh-CN')}`;
                
            } catch (error) {
                console.error('加载数据失败:', error);
                loading.innerHTML = '<div class="error">加载数据失败，请检查服务是否运行</div>';
            }
        }
        
        async function createStationCard(stationName, stationInfo) {
            const card = document.createElement('div');
            card.className = 'station-card';
            
            let statusClass = 'status-waiting';
            let statusText = `数据不足 (${stationInfo.data_points}/24)`;
            
            if (stationInfo.can_predict) {
                statusClass = 'status-ready';
                statusText = '可预测';
            }
            
            card.innerHTML = `
                <div class="station-header">
                    <div class="station-name">${stationName}</div>
                    <div class="status-badge ${statusClass}">${statusText}</div>
                </div>
                <div class="forecast-data" id="forecast-${stationName}">
                    ${stationInfo.can_predict ? '正在加载预测数据...' : '需要更多数据才能进行预测'}
                </div>
            `;
            
            // 如果可以预测，加载预测数据
            if (stationInfo.can_predict) {
                try {
                    const predictionResponse = await fetch(`${API_BASE}/predictions/${encodeURIComponent(stationName)}`);
                    
                    if (!predictionResponse.ok) {
                        throw new Error(`HTTP ${predictionResponse.status}: ${predictionResponse.statusText}`);
                    }
                    
                    const prediction = await predictionResponse.json();
                    
                    if (prediction.status === 'success' && prediction.forecast) {
                        const forecastHtml = generateForecastHtml(prediction.forecast);
                        document.getElementById(`forecast-${stationName}`).innerHTML = forecastHtml;
                    } else {
                        document.getElementById(`forecast-${stationName}`).innerHTML = 
                            `<div class="error">预测失败: ${prediction.error || prediction.status || '未知错误'}</div>`;
                    }
                } catch (error) {
                    console.error(`加载预测数据失败 (${stationName}):`, error);
                    document.getElementById(`forecast-${stationName}`).innerHTML = 
                        `<div class="error">加载预测数据失败: ${error.message}</div>`;
                }
            }
            
            return card;
        }
        
        function generateForecastHtml(forecast) {
            if (!forecast || forecast.length === 0) {
                return '<div class="error">暂无预测数据</div>';
            }
            
            let html = '<h4>未来6步预测:</h4>';
            
            forecast.forEach((item, index) => {
                const time = new Date(item.time).toLocaleString('zh-CN');
                html += `
                    <div class="forecast-item">
                        <span class="forecast-label">步骤 ${index + 1} (${time}):</span>
                    </div>
                    <div class="forecast-item">
                        <span class="forecast-label">温度:</span>
                        <span class="forecast-value">${item.temperature ? item.temperature.toFixed(1) + '°C' : 'N/A'}</span>
                    </div>
                    <div class="forecast-item">
                        <span class="forecast-label">湿度:</span>
                        <span class="forecast-value">${item.humidity ? item.humidity + '%' : 'N/A'}</span>
                    </div>
                    <div class="forecast-item">
                        <span class="forecast-label">风向:</span>
                        <span class="forecast-value">${item.wind_dir ? item.wind_dir + '°' : 'N/A'}</span>
                    </div>
                    <div class="forecast-item">
                        <span class="forecast-label">风速:</span>
                        <span class="forecast-value">${item.wind_speed ? item.wind_speed.toFixed(1) + ' m/s' : 'N/A'}</span>
                    </div>
                    <hr style="margin: 10px 0; border: none; border-top: 1px solid #ddd;">
                `;
            });
            
            return html;
        }
        
        // 页面加载时自动加载数据和建立WebSocket连接
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            connectWebSocket();
        });
        
        // 由于使用WebSocket实时更新，不再需要定时刷新
    </script>
</body>
</html>
