exp_id: antaws_demo_q2_kunlun
station_id_main: Kunlun
freq: 3H
resample_freq: null
seed: 42
paths:
  raw_root: data/AntAWS/3_hourly
  processed_root: data/processed
  reports_root: reports
  models_root: models
columns:
  targets:
  - temperature_c
  - wind_speed_ms
horizons:
- 1
- 2
- 4
- 8
window_size: 24
stride: 1
max_windows: null
split:
  mode: ratio
  train: 0.7
  val: 0.1
  test: 0.2
impute:
  strategy: A
  max_gap_steps: 4
  strategy_b: stl
features:
  rolling_windows:
  - 2
  - 8
  diff_steps:
  - 1
  - 2
  include_time_features: true
  include_missing_features: true
models:
  tft:
    d_model: 128
    nhead: 4
    num_layers: 2
    dropout: 0.1
    lr: 0.001
    epochs: 20
    batch_size: 64
    weight_decay: 0.0
  tcn:
    channels:
    - 32
    - 32
    kernel_size: 3
    dropout: 0.1
    lr: 0.001
    epochs: 20
    batch_size: 64
  tabular:
    model: gbrt
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
loss:
  lambda_phys: 0.1
  use_bounds_term: true
  use_coherence_term: true
baseline:
  season_length: 8
extremes:
  top_pct: 0.1
  bottom_pct: 0.1
plot:
  timeline_points: 500
processed_dir: data/processed/antaws_demo_q2_kunlun
reports_dir: reports/antaws_demo_q2_kunlun
models_dir: models/antaws_demo_q2_kunlun
